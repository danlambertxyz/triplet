# Tagging a version (e.g. v1.0.0) builds the app and attaches the single
# triplet.html file to a GitHub release, for people who want to download it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cp dist/index.html triplet.html
      - name: Create the release with triplet.html attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" triplet.html --title "Triplet $GITHUB_REF_NAME" --generate-notes
